name: SwiftDrop SwiftMotion APK QA

on:
  push:
    branches:
      - design/swiftmotion-original-ui-v1
    paths:
      - 'SwiftDrop-Android/**'
      - '.github/workflows/swiftdrop-swiftmotion-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftmotion-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SwiftDrop-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore existing app signing identity
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swiftdrop-debug.keystore
          key: swiftdrop-android-debug-keystore-v1
      - name: Require previously verified signing key
        env:
          SIGNING_CACHE_HIT: ${{ steps.signing.outputs.cache-hit }}
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        run: |
          test "$SIGNING_CACHE_HIT" = true
          test -s "$SWIFTDROP_DEBUG_KEYSTORE"
      - name: Unit tests, Lint, APK and instrumentation compilation
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify identity and existing release signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" |
            head -1 | grep -F "package: name='app.swiftdrop' versionCode='23' versionName='0.5.0-alpha'"
          gh release download swiftdrop-v0.5.0-alpha --repo "$GITHUB_REPOSITORY" \
            --pattern SwiftDrop-v0.5.0-alpha.apk --dir "$RUNNER_TEMP/stable"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/current"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            "$RUNNER_TEMP/stable/SwiftDrop-v0.5.0-alpha.apk" > "$RUNNER_TEMP/stable-cert"
          C="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/current")"
          S="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/stable-cert")"
          test -n "$C"
          test "$C" = "$S"
          sha256sum "$APK"
      - name: Upload verified preview APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDrop-SwiftMotion-QA-APK
          path: SwiftDrop-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Save failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDrop-SwiftMotion-Failed-Reports
          path: |
            SwiftDrop-Android/app/build/reports
            SwiftDrop-Android/app/build/test-results
          if-no-files-found: warn
          retention-days: 7
