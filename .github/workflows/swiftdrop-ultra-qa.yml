name: SwiftDrop Ultra Preview QA

on:
  pull_request:
    branches: [swiftdrop-android-v0.1-alpha]
    paths:
      - 'SwiftDrop-Android/**'
      - '.github/workflows/swiftdrop-ultra-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SwiftDrop-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile, test and lint (no publication)
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
