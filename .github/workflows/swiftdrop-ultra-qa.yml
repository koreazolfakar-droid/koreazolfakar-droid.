name: SwiftDrop Ultra Preview QA

on:
  pull_request:
    branches: [swiftdrop-android-v0.1-alpha]
    paths:
      - 'SwiftDrop-Android/**'
      - '.github/workflows/swiftdrop-ultra-qa.yml'

permissions:
  contents: read

concurrency:
  group: ultra-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SwiftDrop-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore original development signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swiftdrop-debug.keystore
          key: swiftdrop-android-debug-keystore-v1
      - name: Require identical signing identity
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
          SIGNING_CACHE_HIT: ${{ steps.signing.outputs.cache-hit }}
        run: |
          test "$SIGNING_CACHE_HIT" = true
          test -s "$SWIFTDROP_DEBUG_KEYSTORE"
      - name: Compile, test and lint (no publication)
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify package and upgrade-compatible signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" |
            head -1 | grep -F "package: name='app.swiftdrop' versionCode='23' versionName='0.5.0-alpha'"
          gh release download swiftdrop-v0.5.0-alpha --repo "$GITHUB_REPOSITORY" \
            --pattern SwiftDrop-v0.5.0-alpha.apk --dir "$RUNNER_TEMP/previous"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/ultra-current-cert.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            "$RUNNER_TEMP/previous/SwiftDrop-v0.5.0-alpha.apk" > "$RUNNER_TEMP/ultra-stable-cert.txt"
          CURRENT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/ultra-current-cert.txt")"
          STABLE="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/ultra-stable-cert.txt")"
          test -n "$CURRENT"
          test "$CURRENT" = "$STABLE"
          sha256sum "$APK"
      - name: Save experimental APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDrop-Ultra-PREVIEW-debug-APK
          path: SwiftDrop-Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
