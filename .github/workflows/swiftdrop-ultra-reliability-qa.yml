name: SwiftDrop Ultra Reliability and Speed QA

on:
  push:
    branches:
      - fix/swiftdrop-ultra-reliability-speed-v1
    paths:
      - 'SwiftDrop-Android/**'
      - '.github/workflows/swiftdrop-ultra-reliability-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftdrop-ultra-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: SwiftDrop-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check Ultra tests, Lint and build with test-only identity
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check package and save hash
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" |
            head -1 | grep -F "package: name='app.swiftdrop' versionCode='23' versionName='0.5.0-alpha'"
          sha256sum "$APK"
          echo "::warning::This build is signed with a CI test key, not the original installation key."
      - name: Keep QA-only APK (never publish)
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDrop-Ultra-UNTRUSTED-SIGNER-QA-ONLY
          path: SwiftDrop-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Save failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDrop-Ultra-Regression-Reports
          path: |
            SwiftDrop-Android/app/build/reports
            SwiftDrop-Android/app/build/test-results
          if-no-files-found: warn
          retention-days: 7
