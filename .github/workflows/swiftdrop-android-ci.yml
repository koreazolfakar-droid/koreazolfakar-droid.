name: SwiftDrop Android APK
on:
  push:
    branches: [swiftdrop-android-v0.1-alpha]
    paths:
      - 'SwiftDrop-Android/**'
      - '.github/workflows/swiftdrop-android-ci.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SwiftDrop-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retain the development APK signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swiftdrop-debug.keystore
          key: swiftdrop-android-debug-keystore-v1
      - name: Prepare the development signing key
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        run: |
          if [ ! -f "$SWIFTDROP_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$SWIFTDROP_DEBUG_KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Install Android SDK packages using runner tools
        run: |
          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate unit tests and debug APK
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android Lint (retry transient repository timeouts)
        run: |
          for attempt in 1 2 3; do
            echo "Android Lint attempt $attempt"
            if gradle --no-daemon :app:lintDebug; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: cd SwiftDrop-Android && gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: swiftdrop-v0.4.10-alpha-debug-apk
          path: SwiftDrop-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # Public browser download instead of the login-gated Actions artifact.
      # Published only after all unit, Lint, and Compose UI tests passed.
      - name: Publish SwiftDrop alpha APK (public prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="swiftdrop-v0.4.10-alpha"
          ASSET="app/build/outputs/apk/debug/app-debug.apk#SwiftDrop-v0.4.10-alpha.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "SwiftDrop 0.4.10-alpha - Storage crash fix" \
              --notes "Temporary alpha test build: fixes ActivityResultRegistryOwner loss when localized Compose context opened Storage on Android 16. Includes a crash report feature. Tested in CI. Android 16 device validation requested."
          fi
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftdrop-v0.4.10-alpha-validation
          path: SwiftDrop-Android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
