name: SwiftDrop Android APK
on:
  push:
    branches: [swiftdrop-android-v0.1-alpha]
    paths:
      - 'SwiftDrop-Android/**'
      - '.github/workflows/swiftdrop-android-ci.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SwiftDrop-Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retain the development APK signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swiftdrop-debug.keystore
          key: swiftdrop-android-debug-keystore-v1
      - name: Prepare the development signing key
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        run: |
          if [ ! -f "$SWIFTDROP_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$SWIFTDROP_DEBUG_KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Install Android SDK packages using runner tools
        run: |
          SDKMGR="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate unit tests and debug APK
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android Lint (retry transient repository timeouts)
        run: |
          for attempt in 1 2 3; do
            echo "Android Lint attempt $attempt"
            if gradle --no-daemon :app:lintDebug; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SWIFTDROP_DEBUG_KEYSTORE: ${{ runner.temp }}/swiftdrop-debug.keystore
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072
          script: |
            (cd SwiftDrop-Android && gradle --no-daemon :app:connectedDebugAndroidTest); result=$?; mkdir -p SwiftDrop-Android/app/build/reports/visual-qa; adb pull /sdcard/Android/data/app.swiftdrop/files/visual-qa SwiftDrop-Android/app/build/reports/visual-qa || true; exit "$result"
            mkdir -p SwiftDrop-Android/app/build/reports/ui-normal
            cp -R SwiftDrop-Android/app/build/reports/androidTests/connected/. SwiftDrop-Android/app/build/reports/ui-normal/
            adb shell settings put system font_scale 1.3
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell appops set app.swiftdrop MANAGE_EXTERNAL_STORAGE allow
            adb shell pm grant app.swiftdrop android.permission.READ_MEDIA_IMAGES
            adb shell pm grant app.swiftdrop android.permission.READ_MEDIA_VIDEO
            adb shell pm grant app.swiftdrop android.permission.READ_MEDIA_AUDIO
            (cd SwiftDrop-Android && gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.swiftdrop.StorageFromMainActivityUiTest,app.swiftdrop.NativeProMainActivityUiTest); result=$?; adb pull /sdcard/Android/data/app.swiftdrop/files/visual-qa SwiftDrop-Android/app/build/reports/visual-qa || true; exit "$result"
            mkdir -p SwiftDrop-Android/app/build/reports/visual-qa
            adb pull /sdcard/Android/data/app.swiftdrop/files/visual-qa SwiftDrop-Android/app/build/reports/visual-qa
            adb shell settings put system font_scale 1.0
            adb shell wm size reset
            adb shell wm density reset
      - uses: actions/upload-artifact@v4
        with:
          name: swiftdrop-v0.5.0-alpha-debug-apk
          path: SwiftDrop-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify package, version and signing upgrade compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          head -1 "$RUNNER_TEMP/apk-badging.txt" | grep -F "package: name='app.swiftdrop' versionCode='23' versionName='0.5.0-alpha'"
          gh release download swiftdrop-v0.4.11-alpha --repo "$GITHUB_REPOSITORY" \
            --pattern app-debug.apk --dir "$RUNNER_TEMP/swiftdrop-previous"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/current-certificate.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            "$RUNNER_TEMP/swiftdrop-previous/app-debug.apk" > "$RUNNER_TEMP/previous-certificate.txt"
          CURRENT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/current-certificate.txt")"
          PREVIOUS="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/previous-certificate.txt")"
          test -n "$CURRENT"
          test "$CURRENT" = "$PREVIOUS"
          sha256sum "$APK" > app/build/reports/apk-sha256.txt
          cp "$RUNNER_TEMP/current-certificate.txt" app/build/reports/apk-certificate.txt
      # Publish only after unit, Lint, both emulator configurations, and identity checks pass.
      - name: Publish SwiftDrop Native Pro alpha APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="swiftdrop-v0.5.0-alpha"
          APK="$RUNNER_TEMP/SwiftDrop-v0.5.0-alpha.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "SwiftDrop 0.5.0-alpha — Native Pro" \
              --notes-file docs/WORKDIR/reports/NATIVE_PRO_RELEASE.md
          fi
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftdrop-v0.5.0-alpha-validation
          path: SwiftDrop-Android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
